<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>睡眠人格测试 — ZENOASIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0B0F1E;--bg-mid:#121836;
  --glass-bg:rgba(15,23,42,.6);--glass-border:rgba(167,139,250,.18);
  --purple-mid:#7C3AED;--purple-deep:#5B21B6;--purple-light:#A78BFA;--purple-soft:#C4B5FD;
  --blue-mid:#3B82F6;--blue-deep:#1E40AF;
  --accent-pink:#F15BB5;--accent-cyan:#22D3EE;
  --text-primary:#F1F0FB;--text-secondary:rgba(241,240,251,.65);--text-muted:rgba(241,240,251,.4);
}
html,body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(165deg,var(--bg-deep) 0%,var(--bg-mid) 40%,#1a1040 100%)}

/* ═══ PARTICLES ═══ */
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ═══ GLOW ORBS ═══ */
.glow-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.glow-orb-1{width:300px;height:300px;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 70%);top:10%;left:-20%;animation:orb-drift 12s ease-in-out infinite}
.glow-orb-2{width:250px;height:250px;background:radial-gradient(circle,rgba(59,130,246,.08),transparent 70%);bottom:20%;right:-15%;animation:orb-drift 15s ease-in-out infinite reverse}
@keyframes orb-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px)}}

/* ═══ APP ═══ */
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;overflow:hidden}
.page{position:absolute;top:0;left:0;width:100%;min-height:100dvh;padding:0 24px;display:flex;flex-direction:column;opacity:0;transform:translateX(60px);transition:all .45s cubic-bezier(.22,1,.36,1);pointer-events:none;will-change:transform,opacity}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative}
.page.exit-left{opacity:0;transform:translateX(-60px);pointer-events:none;position:absolute}
.page.exit-right{opacity:0;transform:translateX(60px);pointer-events:none;position:absolute}

/* ═══ WELCOME ═══ */
.welcome-brand{text-align:center;padding-top:12vh}
.brand-logo{font-size:13px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:var(--purple-light);margin-bottom:4px}
.brand-cn{font-size:11px;font-weight:300;color:var(--text-muted);letter-spacing:2px}
.welcome-hero{text-align:center;margin-top:8vh}
.hero-emoji{font-size:64px;line-height:1;margin-bottom:20px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero-title{font-size:28px;font-weight:900;line-height:1.35;background:linear-gradient(135deg,var(--text-primary) 0%,var(--purple-soft) 50%,var(--accent-cyan) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.hero-sub{font-size:14px;color:var(--text-secondary);line-height:1.6;max-width:280px;margin:0 auto}
.welcome-meta{display:flex;justify-content:center;gap:24px;margin-top:36px}
.meta-item{text-align:center}
.meta-num{font-size:22px;font-weight:700;color:var(--purple-light)}
.meta-label{font-size:11px;color:var(--text-muted);margin-top:2px}
.welcome-cta{margin-top:auto;padding-bottom:48px;padding-top:40px}

/* ═══ BUTTONS ═══ */
.btn-primary{width:100%;padding:16px 32px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--purple-mid) 0%,var(--purple-deep) 50%,var(--blue-deep) 100%);color:#fff;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s;box-shadow:0 8px 32px rgba(124,58,237,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,transparent 60%);pointer-events:none}
.btn-primary:active{transform:scale(.97);box-shadow:0 4px 16px rgba(124,58,237,.3)}

/* ═══ QUIZ ═══ */
.quiz-header{padding-top:56px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.btn-back{width:36px;height:36px;border:1.5px solid var(--glass-border);border-radius:10px;background:var(--glass-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text-secondary);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.btn-back:active{transform:scale(.92)}
.progress-wrap{flex:1;height:6px;background:rgba(167,139,250,.12);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--purple-mid),var(--accent-cyan));border-radius:3px;transition:width .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 12px rgba(124,58,237,.5)}
.question-num{font-size:12px;color:var(--text-muted);font-weight:500;min-width:32px;text-align:right}
.quiz-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0 40px;min-height:70dvh}
.question-text{font-size:22px;font-weight:700;line-height:1.45;margin-bottom:32px;min-height:64px}
.option-list{display:flex;flex-direction:column;gap:12px}
.option-btn{width:100%;text-align:left;padding:16px 20px;border:1.5px solid var(--glass-border);border-radius:14px;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text-primary);font-size:15px;font-weight:400;font-family:inherit;line-height:1.5;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.option-btn:active{transform:scale(.97)}
.option-btn.selected{border-color:var(--purple-mid);background:rgba(124,58,237,.22)}
.opt-letter{display:inline-block;width:22px;height:22px;border-radius:6px;background:rgba(167,139,250,.15);color:var(--purple-light);font-size:12px;font-weight:700;text-align:center;line-height:22px;margin-right:10px;flex-shrink:0;position:relative;z-index:1}
.option-btn.selected .opt-letter{background:var(--purple-mid);color:#fff}
.opt-text{position:relative;z-index:1}

/* ═══ LOADING ═══ */
.loading-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100dvh}
.loading-moon{font-size:80px;animation:pulse-glow 2s ease-in-out infinite;margin-bottom:32px}
@keyframes pulse-glow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(167,139,250,.4))}50%{transform:scale(1.08);filter:drop-shadow(0 0 40px rgba(167,139,250,.7))}}
.loading-text{font-size:17px;font-weight:500;color:var(--text-secondary);margin-bottom:16px}
.loading-dots{display:flex;gap:8px;justify-content:center}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--purple-light);animation:dot-bounce 1.4s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.16s}
.loading-dots span:nth-child(3){animation-delay:.32s}
@keyframes dot-bounce{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}

/* ═══ RESULT ═══ */
.result-page{padding-bottom:60px}
.result-hero{text-align:center;padding-top:56px;margin-bottom:8px}
.result-emoji{font-size:72px;line-height:1;margin-bottom:16px;animation:float 4s ease-in-out infinite}
.result-name{font-size:30px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,var(--text-primary),var(--purple-soft));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-tagline{font-size:15px;color:var(--text-secondary);line-height:1.5}
.result-section{margin-top:28px}
.section-label{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--purple-light);margin-bottom:12px}
.result-profile{font-size:15px;line-height:1.8;color:var(--text-secondary);padding:20px;border-radius:16px;background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-border)}
.tip-card{padding:18px 20px;border-radius:14px;background:var(--glass-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);margin-bottom:10px}
.tip-num{display:inline-block;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--purple-mid),var(--blue-mid));color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:24px;margin-right:8px;vertical-align:middle}
.tip-text{font-size:14px;line-height:1.7;color:var(--text-secondary);display:inline}
.product-card{margin-top:32px;padding:24px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(91,33,182,.2),rgba(30,64,175,.15));border:1px solid rgba(167,139,250,.25);position:relative;overflow:hidden}
.product-card::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,.15),transparent 70%);pointer-events:none}
.product-label{font-size:11px;font-weight:500;color:var(--accent-cyan);letter-spacing:1px;margin-bottom:8px}
.product-desc{font-size:13px;line-height:1.7;color:var(--text-secondary);position:relative}
.result-actions{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.btn-share{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--purple-mid),var(--blue-mid));color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .2s;box-shadow:0 6px 24px rgba(124,58,237,.3)}
.btn-share:active{transform:scale(.97)}
.btn-retake{width:100%;padding:14px;border:1.5px solid var(--glass-border);border-radius:14px;background:transparent;color:var(--text-secondary);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-retake:active{transform:scale(.97);background:rgba(91,33,182,.1)}
.disclaimer{text-align:center;font-size:11px;color:var(--text-muted);margin-top:24px;line-height:1.6;padding:0 8px}

/* ═══ SHARE OVERLAY ═══ */
.share-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .3s}
.share-overlay.visible{opacity:1;pointer-events:auto}
.share-card-wrap{width:100%;max-width:340px;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);margin-bottom:24px}
.share-card-wrap canvas{width:100%;height:auto;display:block}
.share-hint{font-size:13px;color:var(--text-secondary);margin-bottom:20px;text-align:center}
.share-close{padding:12px 40px;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-family:inherit;cursor:pointer}
/* ═══ WVDIAN MODAL + TOAST ═══ */
.wvdian-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:110;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .3s}
.wvdian-overlay.visible{opacity:1;pointer-events:auto}
.wvdian-card{width:100%;max-width:320px;padding:32px 24px;border-radius:20px;background:linear-gradient(165deg,#121836,#1a1040);border:1px solid rgba(167,139,250,.25);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.wvdian-title{font-size:17px;font-weight:700;margin-bottom:6px}
.wvdian-sub{font-size:12px;color:var(--text-muted);margin-bottom:20px;line-height:1.6}
.wvdian-qr-wrap{display:inline-block;padding:12px;border-radius:16px;background:#fff;line-height:0;margin-bottom:16px}
.wvdian-qr-wrap canvas{width:200px;height:200px}
.wvdian-hint{font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:20px}
.wvdian-copy{padding:10px 28px;border:1.5px solid var(--glass-border);border-radius:10px;background:var(--glass-bg);color:var(--text-secondary);font-size:13px;font-family:inherit;cursor:pointer}
.wvdian-copy:active{transform:scale(.96)}
.btn-wvdian{width:100%;padding:16px;border:1.5px solid rgba(34,211,238,.35);border-radius:16px;background:linear-gradient(135deg,rgba(34,211,238,.12),rgba(59,130,246,.10));color:var(--accent-cyan);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .2s}
.btn-wvdian:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(20px);padding:10px 22px;border-radius:10px;background:rgba(15,23,42,.92);border:1px solid var(--glass-border);color:var(--text-primary);font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<canvas id="particles-canvas"></canvas>

<div id="app">
  <div id="page-welcome" class="page active">
    <div class="welcome-brand">
      <div class="brand-logo">ZENOASIS</div>
      <div class="brand-cn">悟昕科技</div>
    </div>
    <div class="welcome-hero">
      <div class="hero-emoji">🌙</div>
      <h1 class="hero-title">你的睡眠人格<br>是什么？</h1>
      <p class="hero-sub">10 个小问题，找到你专属的睡眠画像<br>以及属于你的改善方案</p>
    </div>
    <div class="welcome-meta">
      <div class="meta-item"><div class="meta-num">10</div><div class="meta-label">道题目</div></div>
      <div class="meta-item"><div class="meta-num">2</div><div class="meta-label">分钟完成</div></div>
      <div class="meta-item"><div class="meta-num">6</div><div class="meta-label">种人格</div></div>
    </div>
    <div class="welcome-cta">
      <button class="btn-primary" onclick="startQuiz()">开始测试</button>
    </div>
  </div>

  <div id="quiz-container"></div>

  <div id="page-loading" class="page loading-page">
    <div class="loading-moon">🌙</div>
    <div class="loading-text">正在分析你的睡眠人格...</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <div id="page-result" class="page result-page"></div>
</div>

<div id="share-overlay" class="share-overlay">
  <div class="share-card-wrap"><canvas id="share-canvas"></canvas></div>
  <div class="share-hint">长按保存图片，分享到朋友圈</div>
  <button class="share-close" onclick="closeShare()">关闭</button>
</div>

<div id="wvdian-overlay" class="wvdian-overlay">
  <div class="wvdian-card">
    <div class="wvdian-title">进入悟昕微店</div>
    <div class="wvdian-sub">ZENOASIS · AI智能睡眠仪</div>
    <div class="wvdian-qr-wrap"><canvas id="wvdian-qr"></canvas></div>
    <div class="wvdian-hint">长按识别上方二维码<br>查看适合你的改善方案</div>
    <button class="wvdian-copy" onclick="copyWvdian()">复制小程序链接</button>
  </div>
  <button class="share-close" style="margin-top:20px" onclick="closeWvdian()">关闭</button>
</div>
<div id="toast"></div>

let currentPage='welcome',currentQuestion=0,answers=[],resultPersonality=null;

/* ═══ PARTICLES ═══ */
function initParticles(){
  const c=document.getElementById('particles-canvas'),ctx=c.getContext('2d');
  let ps=[],w,h;
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  function create(){
    ps=[];const n=Math.floor(w*h/12000);
    for(let i=0;i<n;i++)ps.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.5,dx:(Math.random()-.5)*.15,dy:(Math.random()-.5)*.1-.05,a:Math.random()*.5+.1,p:Math.random()*Math.PI*2});
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ps.forEach(p=>{
      p.x+=p.dx;p.y+=p.dy;p.p+=.008;
      if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10;if(p.y<-10)p.y=h+10;if(p.y>h+10)p.y=-10;
      const al=p.a*(.6+.4*Math.sin(p.p));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(167,139,250,${al})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize();create();draw();
  window.addEventListener('resize',()=>{resize();create()});
}

/* ═══ NAVIGATION ═══ */
function showPage(id,dir){
  const old=document.querySelector('.page.active'),nw=document.getElementById(id);
  if(!nw)return;
  if(old&&old!==nw){
    old.classList.remove('active');
    old.classList.add(dir==='forward'?'exit-left':'exit-right');
    setTimeout(()=>{old.classList.remove('exit-left','exit-right');old.style.position='absolute'},500);
  }
  nw.style.position='relative';void nw.offsetHeight;nw.classList.add('active');
  currentPage=id.replace('page-','');
}
function startQuiz(){track('quiz','start','entry');currentQuestion=0;answers=[];buildQuiz();showPage('page-q0','forward')}
function buildQuiz(){
  const c=document.getElementById('quiz-container');c.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const d=document.createElement('div');d.id=`page-q${i}`;d.className='page';
    const pct=(i/QUESTIONS.length*100).toFixed(0);
    const back=i===0?`<button class="btn-back" onclick="showPage('page-welcome','back')">←</button>`:`<button class="btn-back" onclick="goToQ(${i-1})">←</button>`;
    d.innerHTML=`<div class="quiz-header">${back}<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><div class="question-num">${i+1}/10</div></div><div class="quiz-body"><div class="question-text">${q.q}</div><div class="option-list">${q.opts.map((o,j)=>`<button class="option-btn" onclick="selectOpt(${i},${j},this)"><span class="opt-letter">${'ABCD'[j]}</span><span class="opt-text">${o}</span></button>`).join('')}</div></div>`;
    c.appendChild(d);
  });
}
function selectOpt(qi,oi,btn){
  const sibs=btn.parentElement.querySelectorAll('.option-btn');sibs.forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');
  answers[qi]=oi;track('quiz','answer','Q'+(qi+1));
  setTimeout(()=>{qi<QUESTIONS.length-1?goToQ(qi+1):showLoading()},350);
}
function goToQ(i){
  currentQuestion=i;
  const pg=document.getElementById(`page-q${i}`);
  if(pg){const bar=pg.querySelector('.progress-bar');if(bar)bar.style.width=`${(i/QUESTIONS.length*100).toFixed(0)}%`}
  showPage(`page-q${i}`,'forward');
}

/* ═══ SCORING ═══ */
function calcResult(){
  const t=[0,0,0,0,0,0];
  QUESTIONS.forEach((q,qi)=>{const a=answers[qi];if(a!==undefined&&q.scores[a])q.scores[a].forEach((s,pi)=>{t[pi]+=s})});
  let mx=-1,mi=0;t.forEach((s,i)=>{if(s>mx){mx=s;mi=i}});
  return PERSONALITIES[mi];
}

/* ═══ LOADING & RESULT ═══ */
function showLoading(){
  showPage('page-loading','forward');
  setTimeout(()=>{resultPersonality=calcResult();track('quiz','complete','finish');renderResult(resultPersonality);showPage('page-result','forward')},2800);
}
function renderResult(p){
  track('result','personality',p.name);
  document.getElementById('page-result').innerHTML=`
    <div class="result-hero"><div class="result-emoji">${p.emoji}</div><div class="result-name">${p.name}</div><div class="result-tagline">"${p.tagline}"</div></div>
    <div class="result-section"><div class="section-label">你的睡眠画像</div><div class="result-profile">${p.profile}</div></div>
    <div class="result-section"><div class="section-label">3 个改善建议</div>${p.tips.map((t,i)=>`<div class="tip-card"><span class="tip-num">${i+1}</span><span class="tip-text">${t}</span></div>`).join('')}</div>
    <div class="product-card"><div class="product-label">✦ ZENOASIS 悟昕如何帮助你</div><div class="product-desc">${p.product}</div></div>
    <div class="result-actions"><button class="btn-share" onclick="genShare()">📤 生成分享卡片</button><button class="btn-wvdian" onclick="openWvdian()">🛒 查看适合你的改善方案</button><button class="btn-retake" onclick="retake()">重新测试</button></div>
    <div class="disclaimer">本测试仅供健康科普参考，不构成医疗诊断或治疗建议</div>`;
}
function retake(){track('quiz','retake','back');answers=[];currentQuestion=0;showPage('page-welcome','back')}

/* ═══ SHARE CARD + QR + WVDIAN ═══ */

  const p=resultPersonality;if(!p)return;

  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  const g1=ctx.createRadialGradient(600,260,0,600,260,320);g1.addColorStop(0,'rgba(124,58,237,.18)');g1.addColorStop(1,'transparent');ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(140,980,0,140,980,280);g2.addColorStop(0,'rgba(59,130,246,.12)');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  for(let i=0;i<26;i++){const sx=Math.random()*W,sy=Math.random()*H;ctx.fillStyle=`rgba(167,139,250,${(.08+Math.random()*.25).toFixed(2)})`;ctx.beginPath();ctx.arc(sx,sy,Math.random()*1.6+.4,0,Math.PI*2);ctx.fill();}
  ctx.textAlign='center';
  ctx.fillStyle='rgba(167,139,250,.55)';ctx.font='500 26px "Noto Sans SC",sans-serif';ctx.fillText('Z E N O A S I S',W/2,86);
  ctx.fillStyle='rgba(167,139,250,.35)';ctx.font='300 19px "Noto Sans SC",sans-serif';ctx.fillText('悟昕科技',W/2,118);
  ctx.strokeStyle='rgba(167,139,250,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2-60,146);ctx.lineTo(W/2+60,146);ctx.stroke();

  ctx.font='110px serif';ctx.fillText(p.emoji,W/2,340);
  ctx.fillStyle='#F1F0FB';ctx.font='900 66px "Noto Sans SC",sans-serif';ctx.fillText(p.name,W/2,448);
  ctx.fillStyle='rgba(241,240,251,.68)';ctx.font='400 28px "Noto Sans SC",sans-serif';
  const tl=wrapL(ctx,p.tagline,W-180);
  if(tl.length===1){ctx.fillText('\u201c'+p.tagline+'\u201d',W/2,506);}
  else{ctx.fillText('\u201c'+tl[0],W/2,506);ctx.fillText(tl[tl.length-1]+'\u201d',W/2,548);}
  const dg=ctx.createLinearGradient(W/2-90,0,W/2+90,0);dg.addColorStop(0,'transparent');dg.addColorStop(.5,'rgba(167,139,250,.35)');dg.addColorStop(1,'transparent');ctx.strokeStyle=dg;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W/2-90,600);ctx.lineTo(W/2+90,600);ctx.stroke();
  const qrSize=230,qx=W/2-qrSize/2,qy=700;
  ctx.fillStyle='rgba(241,240,251,.06)';roundRect(ctx,qx-30,qy-30,qrSize+60,qrSize+60,24);ctx.fill();
  ctx.strokeStyle='rgba(167,139,250,.2)';ctx.lineWidth=1;roundRect(ctx,qx-30,qy-30,qrSize+60,qrSize+60,24);ctx.stroke();
  drawQROnCtx(ctx,location.href,qx,qy,qrSize);
  ctx.fillStyle='rgba(241,240,251,.6)';ctx.font='400 24px "Noto Sans SC",sans-serif';ctx.fillText('扫码 · 测测你的睡眠人格',W/2,qy+qrSize+70);
  ctx.fillStyle='rgba(167,139,250,.5)';ctx.font='500 22px "Noto Sans SC",sans-serif';ctx.fillText('ZENOASIS · 悟昕AI智能睡眠仪',W/2,H-120);
  ctx.fillStyle='rgba(241,240,251,.25)';ctx.font='300 16px "Noto Sans SC",sans-serif';ctx.fillText('本测试仅供健康科普参考',W/2,H-88);
  ov.classList.add('visible');
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawQROnCtx(ctx,text,x,y,size){
  const qr=qrcodegen.QrCode.encodeText(text,qrcodegen.QrCode.Ecc.MEDIUM);
  const n=qr.size,cell=size/n;
  ctx.fillStyle='#fff';ctx.fillRect(x,y,size,size);
  ctx.fillStyle='#0B0F1E';
  for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++){if(qr.getModule(xx,yy))ctx.fillRect(x+xx*cell,y+yy*cell,Math.ceil(cell),Math.ceil(cell));}
}
function drawQRCanvas(canvas,text,px){
  const qr=qrcodegen.QrCode.encodeText(text,qrcodegen.QrCode.Ecc.MEDIUM);
  const n=qr.size;canvas.width=px;canvas.height=px;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,px,px);
  ctx.fillStyle='#0B0F1E';
  const cell=px/n;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(qr.getModule(x,y))ctx.fillRect(Math.floor(x*cell),Math.floor(y*cell),Math.ceil(cell),Math.ceil(cell));}
}
function openWvdian(){
  track('wvdian','click','open');
  drawQRCanvas(document.getElementById('wvdian-qr'),CONFIG.WVDIAN_LINK,400);
  document.getElementById('wvdian-overlay').classList.add('visible');
}
function closeWvdian(){document.getElementById('wvdian-overlay').classList.remove('visible')}
function copyWvdian(){
  track('wvdian','click','copy');
  const text=CONFIG.WVDIAN_LINK;
  function done(){showToast('已复制，粘贴到微信聊天即可打开')}
  function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){showToast('复制失败')}document.body.removeChild(ta)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(fallback)}else fallback();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('visible');
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('visible'),2200);
}
function wrapL(ctx,t,mw){const cs=t.split('');let l='';const ls=[];for(let i=0;i<cs.length;i++){const tl=l+cs[i];if(ctx.measureText(tl).width>mw&&i>0){ls.push(l);l=cs[i]}else l=tl}if(l)ls.push(l);return ls}
function closeShare(){document.getElementById('share-overlay').classList.remove('visible')}

document.addEventListener('DOMContentLoaded',initParticles);
